<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title description">
  <title id="title">OneTrack v2 システム構成図</title>
  <desc id="description">ユーザーのブラウザ上でReactが動作し、HTTPSでAWS EC2上のNginxへ接続する。NginxはPM2で管理されたNext.jsへリバースプロキシし、Next.js内のPrisma Clientが同じEC2上のMySQLへ接続する。GitHub ActionsがEC2へデプロイし、Next.jsはLINE Messaging APIおよびResendと通信する。</desc>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',Meiryo,-apple-system,'Segoe UI',sans-serif">
    <text x="600" y="36" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">OneTrack v2 システム構成</text>

    <!-- GitHub Actions -->
    <rect x="478" y="58" width="300" height="66" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="509" cy="91" r="17" fill="#0F172A"/>
    <circle cx="509" cy="91" r="7" fill="#ffffff"/>
    <text x="538" y="83" font-size="14" font-weight="700" fill="#0F172A">GitHub Actions</text>
    <text x="538" y="105" font-size="12" fill="#475569">CI: PR → main ／ CD: push → release</text>

    <!-- Browser -->
    <rect x="25" y="224" width="230" height="222" rx="14" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.2"/>
    <rect x="45" y="245" width="190" height="34" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
    <circle cx="62" cy="262" r="4" fill="#60A5FA"/>
    <circle cx="76" cy="262" r="4" fill="#60A5FA"/>
    <circle cx="90" cy="262" r="4" fill="#60A5FA"/>
    <text x="140" y="315" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="middle">ユーザーのブラウザ</text>
    <text x="140" y="347" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="middle">React 18</text>
    <text x="140" y="373" font-size="12" fill="#1D4ED8" text-anchor="middle">SWR ／ Zustand</text>
    <text x="140" y="397" font-size="12" fill="#1D4ED8" text-anchor="middle">Tailwind CSS ／ shadcn/ui</text>
    <text x="140" y="424" font-size="11" fill="#64748B" text-anchor="middle">UI表示・クライアント状態管理</text>

    <!-- EC2 container -->
    <rect x="310" y="154" width="865" height="426" rx="18" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.4"/>
    <rect x="334" y="174" width="42" height="24" rx="5" fill="#FF9900"/>
    <text x="355" y="190" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">AWS</text>
    <text x="390" y="192" font-size="19" font-weight="700" fill="#7C2D12">EC2 インスタンス</text>

    <!-- Nginx -->
    <rect x="340" y="254" width="170" height="142" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="1.2"/>
    <text x="425" y="292" font-size="17" font-weight="700" fill="#065F46" text-anchor="middle">Nginx</text>
    <text x="425" y="324" font-size="12" fill="#047857" text-anchor="middle">TLS終端</text>
    <text x="425" y="348" font-size="12" fill="#047857" text-anchor="middle">リバースプロキシ</text>
    <text x="425" y="375" font-size="11" fill="#64748B" text-anchor="middle">HTTPS :443</text>

    <!-- Next.js / PM2 -->
    <rect x="555" y="224" width="340" height="256" rx="12" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.2"/>
    <rect x="575" y="244" width="300" height="42" rx="7" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
    <text x="725" y="266" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">PM2 → Next.js 14（Node.js）</text>

    <text x="725" y="316" font-size="13" font-weight="700" fill="#1E40AF" text-anchor="middle">App Router ／ Route Handlers</text>
    <path d="M615 337H835" fill="none" stroke="#93C5FD" stroke-width="1"/>
    <text x="725" y="362" font-size="12" fill="#1D4ED8" text-anchor="middle">Route Handler → Service → Repository</text>
    <text x="725" y="388" font-size="12" fill="#1D4ED8" text-anchor="middle">Zod ／ jose（JWT認証）</text>

    <rect x="582" y="411" width="132" height="44" rx="7" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
    <text x="648" y="433" font-size="12" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">Prisma Client</text>
    <rect x="729" y="411" width="139" height="44" rx="7" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
    <text x="798" y="426" font-size="12" font-weight="700" fill="#1E40AF" text-anchor="middle">node-cron</text>
    <text x="798" y="443" font-size="11" fill="#1D4ED8" text-anchor="middle">21時通知／5時リセット</text>

    <!-- MySQL inside EC2 -->
    <rect x="940" y="254" width="200" height="202" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="1040" y="290" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">MySQL</text>
    <rect x="1005" y="325" width="70" height="46" fill="#334155"/>
    <ellipse cx="1040" cy="371" rx="35" ry="11" fill="#334155"/>
    <ellipse cx="1040" cy="325" rx="35" ry="11" fill="#334155" stroke="#64748B" stroke-width="1"/>
    <ellipse cx="1040" cy="348" rx="35" ry="11" fill="none" stroke="#94A3B8" stroke-width="1"/>
    <text x="1040" y="407" font-size="12" fill="#475569" text-anchor="middle">Prisma Migrate</text>
    <text x="1040" y="430" font-size="11" fill="#64748B" text-anchor="middle">論理削除／複合インデックス</text>

    <!-- External services -->
    <rect x="570" y="630" width="270" height="66" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="1.2"/>
    <rect x="590" y="647" width="34" height="34" rx="8" fill="#06C755"/>
    <text x="607" y="668" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">LINE</text>
    <text x="640" y="656" font-size="14" font-weight="700" fill="#065F46">LINE Messaging API</text>
    <text x="640" y="678" font-size="11" fill="#047857">Webhook受信／サマリー配信</text>

    <rect x="940" y="630" width="200" height="66" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="1040" y="656" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Resend</text>
    <text x="1040" y="678" font-size="11" fill="#475569" text-anchor="middle">パスワードリセットメール</text>

    <!-- Request path -->
    <path d="M255 335H340" fill="none" stroke="#334155" stroke-width="1.8" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
    <text x="297" y="320" font-size="12" fill="#475569" text-anchor="middle">HTTPS</text>

    <path d="M510 335H555" fill="none" stroke="#334155" stroke-width="1.8" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
    <text x="533" y="320" font-size="11" fill="#475569" text-anchor="middle">HTTP</text>

    <path d="M648 455V510H1040V456" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-dark)"/>
    <text x="910" y="503" font-size="11" fill="#475569" text-anchor="middle">Prisma Client ／ SQL</text>

    <!-- Deployment -->
    <path d="M628 124V145" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-dark)"/>
    <text x="642" y="142" font-size="11" fill="#64748B">SSHデプロイ</text>

    <!-- LINE push and webhook -->
    <path d="M760 480V600H665V630" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
    <text x="676" y="596" font-size="11" fill="#047857">Push API（毎日21時）</text>

    <path d="M745 630V612H535V374H510" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
    <text x="548" y="606" font-size="11" fill="#1D4ED8">Webhook（アカウント連携）</text>

    <!-- Email -->
    <path d="M875 480V608H1040V630" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-dark)"/>
    <text x="944" y="603" font-size="11" fill="#475569">メール送信API</text>
  </g>
</svg>
